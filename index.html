<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dla Ewuni - 50. Urodziny</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600&family=Montserrat:wght@300;400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --boho-green: #7d8c7c;     
            --boho-gold: #c6a664;      
            --boho-bg: #fcfbf9;        
            --text-main: #3a3b36;      
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
            background-color: var(--boho-bg);
            background: linear-gradient(rgba(252, 251, 249, 0.85), rgba(252, 251, 249, 0.92)), 
                        url('https://images.unsplash.com/photo-1542458428-144f84a86470?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat fixed;
        }

        .gold-frame {
            position: fixed;
            top: 25px; left: 25px; right: 25px; bottom: 25px;
            pointer-events: none; 
            z-index: 5;
        }

        .gold-frame::before, .gold-frame::after {
            content: '';
            position: absolute;
            width: 20vw;
            height: 25vh;
            max-width: 250px;
            max-height: 250px;
            border: 2px solid var(--boho-gold);
        }

        .gold-frame::before { top: 0; left: 0; border-right: none; border-bottom: none; }
        .gold-frame::after { bottom: 0; right: 0; border-left: none; border-top: none; }

        /* --- EKRAN POWITALNY --- */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 10;
            transition: opacity 1s ease-in-out;
        }

        #welcome-screen h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-style: italic;
            font-size: 7.5rem;
            color: var(--boho-green);
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            animation: fadeInDown 1.8s ease-out;
        }

        #welcome-screen p {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 1.4rem;
            margin: 0 0 50px 0;
            color: var(--text-main);
            letter-spacing: 6px;
            text-transform: uppercase;
            animation: fadeInUp 1.8s ease-out 0.4s backwards;
        }

        .btn-discover {
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-main);
            border: 1px solid var(--boho-gold);
            padding: 18px 55px;
            font-size: 1rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            cursor: pointer;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            backdrop-filter: blur(5px);
            animation: fadeInUp 1.8s ease-out 0.8s backwards;
        }

        .btn-discover:hover {
            background: var(--boho-gold);
            color: #fff;
            transform: translateY(-3px);
        }

        /* --- EKRAN GŁÓWNY --- */
        #main-content {
            display: none;
            opacity: 0;
            padding: 40px 20px;
            max-width: 900px;
            margin: 0 auto;
            height: 100vh; 
            flex-direction: column;
            transition: opacity 1s ease-in-out;
            position: relative;
            z-index: 10;
        }

        .main-title {
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 6px;
            font-size: 1.4rem;
            color: var(--text-main);
            margin: 0 0 25px 0;
            flex-shrink: 0;
        }

        .vertical-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            flex-grow: 1; 
            overflow: hidden; 
        }

        .video-section {
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(198, 166, 100, 0.25);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            flex-shrink: 0; 
        }

        video {
            width: 100%;
            max-height: 40vh; 
            display: block;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .poem-section {
            width: 100%;
            background: rgba(255, 255, 255, 0.5);
            padding: 25px 40px;
            border: 1px solid rgba(198, 166, 100, 0.25);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            backdrop-filter: blur(10px);
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            overflow: hidden; 
            margin-bottom: 20px; 
        }

        .poem-section h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            text-transform: uppercase;
            font-size: 1.4rem;
            color: var(--text-main);
            text-align: center;
            margin: 0 0 15px 0;
            border-bottom: 1px solid var(--boho-gold);
            padding-bottom: 15px;
            letter-spacing: 6px;
            flex-shrink: 0;
        }

        .poem-subtitle {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 0.8rem;
            color: var(--boho-gold);
            text-align: center;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: -8px 0 18px 0;
            flex-shrink: 0;
        }

        .scrollable-poem {
            flex-grow: 1;
            overflow-y: auto; 
            padding-right: 15px; 
        }

        .scrollable-poem::-webkit-scrollbar { width: 4px; }
        .scrollable-poem::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        .scrollable-poem::-webkit-scrollbar-thumb { background: var(--boho-gold); border-radius: 10px; }

        .poem-text {
            font-family: 'Inter', sans-serif; 
            font-size: 1.15rem; 
            font-weight: 300;
            line-height: 1.8;
            white-space: pre-line;
            color: var(--text-main);
            text-align: center;
            margin: 0;
            padding-bottom: 30px; 
        }

        #music-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(255,255,255,0.85);
            border: 1px solid var(--boho-gold);
            padding: 10px 20px;
            display: flex; 
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }

        #music-control:hover { background: var(--boho-gold); color: white; }

        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            #welcome-screen h1 { font-size: 4rem; }
            .main-title { font-size: 1.2rem; letter-spacing: 3px; }
            .poem-section h2 { font-size: 1.1rem; }
            .poem-text { font-size: 1rem; }
            .gold-frame { top: 15px; left: 15px; right: 15px; bottom: 15px; }
            video { max-height: 30vh; }
        }
    </style>
</head>
<body>

    <div class="gold-frame"></div>

    <audio id="bgMusic" src="background.mp3" loop></audio>

    <div id="welcome-screen">
        <h1>Ewuniu!</h1>
        <p>Twoja Niespodzianka</p>
        <button class="btn-discover" onclick="revealSurprise(this)">Odkryj</button>
    </div>

    <div id="main-content">
        <h1 class="main-title">Wszystkiego Najlepszego</h1>
        
        <div class="vertical-layout">
            <div class="video-section">
                <video id="birthdayVideo" controls playsinline>
                    <source src="0530.mp4" type="video/mp4">
                    Twoja przeglądarka nie obsługuje odtwarzacza wideo.
                </video>
            </div>

            <div class="poem-section">
                <h2>18 262 DNI</h2>
                <p class="poem-subtitle">od urodzenia, do kolejnej okrągłej rocznicy</p>
                <div class="scrollable-poem">
                    <div class="poem-text" id="poem-container">
                        Piękne słowa się ładują...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="music-control" onclick="toggleMusic()">
        <span id="musicBtnIcon">🎵</span>
        <span id="musicBtnText">Muzyka gra</span>
    </div>

    <script>
        const video = document.getElementById('birthdayVideo');
        const bgMusic = document.getElementById('bgMusic');
        const musicControl = document.getElementById('music-control');
        const musicBtnIcon = document.getElementById('musicBtnIcon');
        const musicBtnText = document.getElementById('musicBtnText');

        bgMusic.volume = 0.18;

        window.onload = function() {
            fetch('wiersz.txt')
                .then(response => response.text())
                .then(text => {
                    document.getElementById('poem-container').innerText = text;
                })
                .catch(error => console.error(error));
        };

        function isMobile() {
            return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        }

        function revealSurprise(btn) {
            btn.disabled = true;
            btn.innerText = "Chwileczkę...";

            // Odblokowanie audio SYNCHRONICZNIE w handlerze kliknięcia (wymóg iOS)
            bgMusic.play().catch(e => console.log(e));
            updateMusicUI(true);
            // Odblokowanie wideo na iOS (musi być w tym samym callstack co kliknięcie)
            video.muted = true;
            video.play().then(() => { video.pause(); video.muted = false; video.currentTime = 0; }).catch(() => {});

            // Wybuch konfetti
            const modernPalette = ['#7d8c7c', '#c6a664', '#fcfbf9', '#a2aa9b'];
            confetti({ particleCount: 200, spread: 120, origin: { y: 0.6 }, colors: modernPalette });
            let end = Date.now() + 2500;
            let interval = setInterval(function() {
                if (Date.now() > end) return clearInterval(interval);
                confetti({ particleCount: 10, angle: 60, spread: 55, origin: { x: 0, y: 0.6 }, colors: modernPalette });
                confetti({ particleCount: 10, angle: 120, spread: 55, origin: { x: 1, y: 0.6 }, colors: modernPalette });
            }, 300);

            // Nowa, agresywna metoda na FullScreen
            // Zamiast pokazywać stronę i potem film, najpierw wyrzucamy sam FILM na cały ekran.
            setTimeout(() => {
                document.getElementById('welcome-screen').style.opacity = '0';
                
                setTimeout(() => {
                    document.getElementById('welcome-screen').style.display = 'none';

                    // Element musi być w DOM (nie display:none) żeby fullscreen działał
                    // Pokazujemy main-content jako niewidoczny (opacity:0), potem fullscreen
                    const mainContent = document.getElementById('main-content');
                    mainContent.style.display = 'flex';
                    mainContent.style.opacity = '0';

                    setTimeout(() => {
                        // Na mobile fullscreen przejmuje audio session iOS – pomijamy
                        const reqFS = !isMobile() && (video.requestFullscreen || video.webkitRequestFullscreen);
                        if (reqFS) {
                            document.addEventListener('fullscreenchange', handleFullscreenChange);
                            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
                            const fsPromise = video.requestFullscreen
                                ? video.requestFullscreen()
                                : video.webkitRequestFullscreen.call(video);
                            if (fsPromise && fsPromise.catch) {
                                fsPromise.catch(() => showMainContent());
                            }
                        } else {
                            showMainContent();
                        }
                        video.play().catch(e => console.log(e));
                    }, 100);
                }, 500);
            }, 1500); // 1.5 sekundy po konfetti
        }

        // Funkcja wywoływana, gdy jubilatka wyjdzie z filmu na pełnym ekranie
        function handleFullscreenChange() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                // Posprzątanie słuchaczy i wyświetlenie strony głównej z wierszem
                document.removeEventListener('fullscreenchange', handleFullscreenChange);
                document.removeEventListener('webkitfullscreenchange', handleFullscreenChange);
                showMainContent();
            }
        }

        // Funkcja bezpiecznie ładująca główną zawartość
        function showMainContent() {
            document.getElementById('main-content').style.display = 'flex';
            setTimeout(() => { document.getElementById('main-content').style.opacity = '1'; }, 50);
        }

        function toggleMusic() {
            if (bgMusic.paused) { bgMusic.play(); updateMusicUI(true); }
            else { bgMusic.pause(); updateMusicUI(false); }
        }

        function updateMusicUI(isPlaying) {
            musicBtnIcon.innerText = isPlaying ? "🎵" : "🔇";
            musicBtnText.innerText = isPlaying ? "Muzyka gra" : "Wyciszono";
            musicControl.style.background = isPlaying ? "rgba(255,255,255,0.85)" : "var(--boho-gold)";
            musicControl.style.color = isPlaying ? "var(--text-main)" : "white";
        }
    </script>
</body>
</html>
