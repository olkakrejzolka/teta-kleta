<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dla Ewuni - 50. Urodziny</title>
    
    <!-- Modern Boho Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Biblioteka do efektu konfetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --boho-green: #7d8c7c;
            --boho-gold: #c6a664;
            --boho-bg: #fcfbf9;
            --text-main: #3a3b36;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            color: var(--text-main);
            overflow-x: hidden;
            background-color: var(--boho-bg);
            background: linear-gradient(rgba(252, 251, 249, 0.88), rgba(252, 251, 249, 0.94)), 
                        url('https://images.unsplash.com/photo-1542458428-144f84a86470?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat fixed;
        }

        /* --- ZŁOTE RAMKI W ROGACH --- */
        .gold-frame {
            position: fixed;
            top: 25px; left: 25px; right: 25px; bottom: 25px;
            pointer-events: none;
            z-index: 5;
        }

        .gold-frame::before, .gold-frame::after {
            content: '';
            position: absolute;
            width: 20vw;
            height: 25vh;
            max-width: 250px;
            max-height: 250px;
            border: 2px solid var(--boho-gold);
        }

        .gold-frame::before {
            top: 0; left: 0;
            border-right: none;
            border-bottom: none;
        }

        .gold-frame::after {
            bottom: 0; right: 0;
            border-left: none;
            border-top: none;
        }

        /* --- EKRAN POWITALNY --- */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 10;
            transition: opacity 1s ease-in-out;
        }

        #welcome-screen h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-style: italic;
            font-size: 7.5rem;
            color: var(--boho-green);
            margin: 0 0 10px 0;
            letter-spacing: 2px;
            animation: fadeInDown 1.8s ease-out;
        }

        #welcome-screen p {
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            font-size: 1.3rem;
            margin: 0 0 50px 0;
            color: var(--text-main);
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: fadeInUp 1.8s ease-out 0.4s backwards;
        }

        .btn-discover {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--boho-gold);
            padding: 18px 55px;
            font-size: 1.1rem;
            font-family: 'Montserrat', sans-serif;
            font-weight: 400;
            cursor: pointer;
            border-radius: 0;
            transition: all 0.4s ease;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: fadeInUp 1.8s ease-out 0.8s backwards;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
        }

        .btn-discover:hover {
            background: var(--boho-gold);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(198, 166, 100, 0.15);
        }

        /* --- EKRAN GŁÓWNY (STRONA PO WYJŚCIU Z PEŁNEGO EKRANU) --- */
        #main-content {
            display: none;
            opacity: 0;
            padding: 60px 20px;
            max-width: 900px;
            margin: 0 auto;
            min-height: 100vh;
            transition: opacity 1s ease-in-out;
            position: relative;
            z-index: 10;
        }

        .main-title {
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 4.5rem;
            color: var(--boho-green);
            margin: 0 0 40px 0;
            font-weight: 600;
        }

        .vertical-layout {
            display: flex;
            flex-direction: column;
            gap: 50px;
            width: 100%;
        }

        .video-section {
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(198, 166, 100, 0.25);
            box-shadow: 0 15px 40px rgba(0,0,0,0.03);
        }

        video {
            width: 100%;
            display: block;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .poem-section {
            width: 100%;
            background: rgba(255, 255, 255, 0.5);
            padding: 50px 40px;
            border: 1px solid rgba(198, 166, 100, 0.25);
            box-shadow: 0 15px 40px rgba(0,0,0,0.03);
            backdrop-filter: blur(10px);
        }

        .poem-section h2 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 2.8rem;
            color: var(--boho-green);
            text-align: center;
            margin: 0 0 30px 0;
            border-bottom: 1px solid var(--boho-gold);
            padding-bottom: 20px;
            letter-spacing: 2px;
        }

        .poem-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.75rem;
            line-height: 1.8;
            white-space: pre-line;
            color: var(--text-main);
            text-align: center;
        }

        /* --- SUBTELNY PANEL MUZYKI W TLE --- */
        #music-control {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: rgba(255,255,255,0.85);
            border: 1px solid var(--boho-gold);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(5px);
        }

        #music-control:hover {
            background: var(--boho-gold);
            color: white;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            #welcome-screen h1 { font-size: 4.5rem; }
            .main-title { font-size: 3.2rem; }
            .gold-frame { top: 15px; left: 15px; right: 15px; bottom: 15px; }
            .poem-section { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="gold-frame"></div>

    <audio id="bgMusic" src="background.mp3" loop></audio>

    <div id="welcome-screen">
        <h1>Ewuniu!</h1>
        <p>Twoja Niespodzianka</p>
        <button class="btn-discover" onclick="revealSurprise(this)">Odkryj</button>
    </div>

    <div id="main-content">
        <h1 class="main-title">Wszystkiego Najlepszego</h1>
        
        <div class="vertical-layout">
            <div class="video-section">
                <video id="birthdayVideo" controls>
                    <source src="0530.mp4" type="video/mp4">
                    Twoja przeglądarka nie obsługuje odtwarzacza wideo.
                </video>
            </div>

            <div class="poem-section">
                <h2>18 262 DNI</h2>
                <div class="poem-text" id="poem-container">
                    Piękne słowa się ładują...
                </div>
            </div>
        </div>
    </div>

    <div id="music-control" onclick="toggleMusic()">
        <span id="musicBtnIcon">🎵</span>
        <span id="musicBtnText">Muzyka gra</span>
    </div>

    <script>
        const video = document.getElementById('birthdayVideo');
        const bgMusic = document.getElementById('bgMusic');
        const musicControl = document.getElementById('music-control');
        const musicBtnIcon = document.getElementById('musicBtnIcon');
        const musicBtnText = document.getElementById('musicBtnText');

        bgMusic.volume = 0.35;

        function startMusicOnLoad() {
            bgMusic.play().then(() => {
                console.log("Muzyka wystartowała automatycznie.");
            }).catch(error => {
                console.log("Autoplay dźwięku zablokowany. Czekam na kliknięcie...");
                document.addEventListener('click', () => {
                    if (document.getElementById('welcome-screen').style.display !== 'none') {
                        bgMusic.play().catch(e => console.log(e));
                        updateMusicUI(true);
                    }
                }, { once: true });
            });
        }

        window.onload = function() {
            startMusicOnLoad();

            fetch('wiersz.txt')
                .then(response => {
                    if (!response.ok) throw new Error('Błąd pliku txt');
                    return response.text();
                })
                .then(text => {
                    document.getElementById('poem-container').innerText = text;
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('poem-container').innerHTML = 
                        "<i>(Upewnij się, że plik wiersz.txt znajduje się w tym samym folderze).</i>";
                });
        };

        function revealSurprise(btn) {
            // Zmiana przycisku podczas animacji konfetti
            btn.disabled = true;
            btn.style.background = "var(--boho-gold)";
            btn.style.color = "white";
            btn.innerText = "Chwileczkę...";
            btn.style.transform = "scale(0.95)";
            btn.style.boxShadow = "none";

            // Odblokowanie wideo w tle dla przeglądarek mobilnych (aby full screen zadziałał z opóźnieniem)
            video.muted = true;
            video.play().then(() => {
                video.pause();
                video.muted = false;
                video.currentTime = 0;
            }).catch(e => console.log(e));

            const modernPalette = ['#7d8c7c', '#c6a664', '#fcfbf9', '#a2aa9b'];
            
            // 1. Wielki wybuch na start
            confetti({ particleCount: 200, spread: 120, origin: { y: 0.6 }, colors: modernPalette });

            // 2. Deszcz konfetti trwający prawie 4 sekundy
            let end = Date.now() + 3800;
            let interval = setInterval(function() {
                if (Date.now() > end) {
                    return clearInterval(interval);
                }
                confetti({ particleCount: 15, angle: 60, spread: 55, origin: { x: 0, y: 0.6 }, colors: modernPalette });
                confetti({ particleCount: 15, angle: 120, spread: 55, origin: { x: 1, y: 0.6 }, colors: modernPalette });
            }, 250);

            // 3. Po zakończeniu konfetti przełączamy ekrany i włączamy wideo
            setTimeout(() => {
                const welcomeScreen = document.getElementById('welcome-screen');
                const mainContent = document.getElementById('main-content');

                welcomeScreen.style.opacity = '0';
                setTimeout(() => {
                    welcomeScreen.style.display = 'none';
                    mainContent.style.display = 'block';
                    setTimeout(() => { 
                        mainContent.style.opacity = '1'; 
                        window.dispatchEvent(new Event('resize'));
                    }, 50);

                    // Odpalenie wideo na pełnym ekranie
                    if (video.requestFullscreen) {
                        video.requestFullscreen().catch(e => console.log(e));
                    } else if (video.webkitRequestFullscreen) {
                        video.webkitRequestFullscreen();
                    } else if (video.msRequestFullscreen) {
                        video.msRequestFullscreen();
                    }

                    video.play().catch(error => console.log("Autoplay zablokowany", error));
                }, 800);
            }, 4000); // Czekamy 4 sekundy!
        }

        // Logika ściszania muzyki tła TYLKO gdy jesteśmy na głównym ekranie
        video.addEventListener('play', () => {
            if (document.getElementById('main-content').style.display === 'block') {
                bgMusic.pause();
                updateMusicUI(false);
            }
        });

        video.addEventListener('pause', () => {
            if (document.getElementById('main-content').style.display === 'block') {
                bgMusic.play().catch(e => console.log(e));
                updateMusicUI(true);
            }
        });

        video.addEventListener('ended', () => {
            if (document.getElementById('main-content').style.display === 'block') {
                bgMusic.play().catch(e => console.log(e));
                updateMusicUI(true);
                confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 }, colors: ['#c6a664', '#7d8c7c'] });
            }
        });

        const fullscreenEvents = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];
        fullscreenEvents.forEach(evt => {
            document.addEventListener(evt, () => {
                const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
                if (!isFullscreen && (video.paused || video.ended)) {
                    bgMusic.play().catch(e => console.log(e));
                    updateMusicUI(true);
                }
            });
        });

        function toggleMusic() {
            if (bgMusic.paused) {
                bgMusic.play();
                updateMusicUI(true);
            } else {
                bgMusic.pause();
                updateMusicUI(false);
            }
        }

        function updateMusicUI(isPlaying) {
            if (isPlaying) {
                musicBtnIcon.innerText = "🎵";
                musicBtnText.innerText = "Muzyka gra";
                musicControl.style.background = "rgba(255,255,255,0.85)";
                musicControl.style.color = "var(--text-main)";
            } else {
                musicBtnIcon.innerText = "🔇";
                musicBtnText.innerText = "Wyciszono";
                musicControl.style.background = "var(--boho-gold)";
                musicControl.style.color = "white";
            }
        }
    </script>
</body>
</html>
